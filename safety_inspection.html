<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>安全パトロール点検アプリ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* レモンイエロー・テーマ（基調色）。判定色 良/要注意/不良 は別に定義 */
    --lemon:#ffe34d; --lemon-soft:#fff7c2;
    --btn:#f07a1a; --btn-dark:#c85e07;
    --blue:#a58a00; --blue-dark:#7a6600; --bg:#fffdf0; --card:#fff;
    --ok:#1e9e57; --warn:#d99000; --ng:#d63b3b; --na:#8a94a6; --line:#ece4b8; --text:#2a2612;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;}
  header{background:var(--lemon);color:var(--blue-dark);padding:12px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15);border-bottom:3px solid #f0cf1a;}
  header h1{margin:0;font-size:18px;font-weight:800;}
  .live{font-size:12px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:6px;opacity:.9;}
  .dot{width:9px;height:9px;border-radius:50%;background:#b7ab5e;display:inline-block;}
  .dot.on{background:#37e07a;box-shadow:0 0 0 3px rgba(55,224,122,.3);}
  .wrap{max-width:860px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--blue-dark);border-left:5px solid var(--blue);padding-left:10px;}
  label.fld{display:block;font-size:13px;font-weight:700;color:#55606e;margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fefcf6;color:var(--text);}
  textarea{min-height:56px;resize:vertical;}
  .row2{display:flex;gap:10px;} .row2>div{flex:1;}
  .switch{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .switch button{flex:1;min-width:120px;padding:12px;border-radius:12px;border:2px solid var(--btn);background:#fff;color:var(--btn-dark);font-weight:700;font-size:15px;cursor:pointer;}
  .switch button.active{background:var(--btn);color:#fff;}
  .sitegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sitebtn{padding:22px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;cursor:pointer;color:var(--blue-dark);text-align:center;}
  .sitebtn.sel{background:var(--btn);color:#fff;border-color:var(--btn);}
  .sitebtn small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:4px;}
  .tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
  .tab{flex:0 0 auto;padding:10px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;color:#55606e;white-space:nowrap;}
  .tab.active{background:var(--btn);color:#fff;border-color:var(--btn);}
  .tab .cnt{font-size:11px;opacity:.85;margin-left:4px;}
  .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;transition:background .3s;}
  .item.flash{background:#fff7d6;}
  .item .q{font-weight:600;font-size:18px;} .item .q .no{color:var(--blue);font-weight:700;margin-right:6px;}
  .item .d{font-size:15px;color:#7a8493;margin:4px 0 9px;}
  .prev{font-size:12px;background:#fbf6d8;border-radius:8px;padding:6px 9px;margin-bottom:9px;color:#6b6338;}
  .prev b{color:var(--blue-dark);}
  .choices{display:flex;gap:6px;}
  .choices button{flex:1;padding:11px 2px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;color:#7a8493;cursor:pointer;}
  .choices button.s-ok{background:var(--ok);color:#fff;border-color:var(--ok);}
  .choices button.s-warn{background:var(--warn);color:#fff;border-color:var(--warn);}
  .choices button.s-ng{background:var(--ng);color:#fff;border-color:var(--ng);}
  .choices button.s-na{background:var(--na);color:#fff;border-color:var(--na);}
  .detail{margin-top:9px;display:none;}
  .detail.show{display:block;}
  .by{font-size:11px;color:#9aa4b2;margin-top:6px;min-height:13px;}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;color:#fff;background:var(--btn);cursor:pointer;margin-top:6px;}
  .btn:active{background:var(--btn-dark);}
  .btn.ghost{background:#fff;color:var(--btn-dark);border:2px solid var(--btn);}
  .btn.warn{background:#fff;color:var(--ng);border:2px solid var(--ng);}
  .btn.sm{padding:10px;font-size:14px;width:auto;}
  .btn:disabled{opacity:.5;}
  .msg{padding:12px;border-radius:10px;margin-bottom:12px;font-weight:700;display:none;}
  .msg.ok{background:#e4f6ec;color:var(--ok);display:block;}
  .msg.err{background:#fbe6e6;color:var(--ng);display:block;}
  .msg.info{background:#fff3b8;color:var(--blue-dark);display:block;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:8px 12px;border-radius:20px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:#55606e;}
  .chip.sel{background:var(--btn);color:#fff;border-color:var(--btn);}
  .mrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .mrow span{flex:1;font-weight:600;}
  .sum{display:flex;gap:8px;margin:8px 0;}
  .sum div{flex:1;text-align:center;background:#fbf7e0;border-radius:10px;padding:8px;}
  .sum .n{font-size:20px;font-weight:800;}
  .sum .a .n{color:var(--ok);} .sum .b .n{color:var(--warn);} .sum .c .n{color:var(--ng);}
  .hist{border-bottom:1px solid var(--line);padding:12px 0;}
  .hist:last-child{border-bottom:none;}
  .hist .top{display:flex;justify-content:space-between;font-weight:700;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;margin-left:4px;}
  .badge.ng{background:#fbe6e6;color:var(--ng);} .badge.ok{background:#e4f6ec;color:var(--ok);} .badge.warn{background:#fdf0d8;color:var(--warn);}
  .hint{font-size:12px;color:#8a94a6;margin-top:6px;}
  .empty{text-align:center;color:#8a94a6;padding:24px 0;}
  .findrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
</style>
</head>

function itemKey(ci,ii){ return ci+"_"+ii; }

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function normDate(v){ return v?String(v).split("T")[0]:""; }

function setLive(on,t){ document.getElementById("liveDot").className="dot"+(on?" on":""); document.getElementById("liveText").textContent=t; }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ===================== 拠点選択 ===================== */
function renderSites(){
  const g = document.getElementById("siteGrid"); g.innerHTML="";
  SITES.forEach(s=>{
    const b=document.createElement("div");
    b.className="sitebtn"+(site===s.key?" sel":"");
    b.innerHTML=esc(s.name)+(s.sub?"<small>"+esc(s.sub)+"</small>":"");
    b.onclick=()=>selectSite(s.key);
    g.appendChild(b);
  });
}
function selectSite(k){
  site=k; siteObj=SITES.find(s=>s.key===k); current=0;
  renderSites();
  document.getElementById("infoCard").style.display="block";
  document.getElementById("checklistArea").style.display="none";
  setLive(false,"「点検を開始／参加」を押すと同期開始");
}

/* ===================== メンバー ===================== */
async function loadMembers(){
  const box=document.getElementById("memberList");
  if(!sb){ box.innerHTML='<div class="empty">Supabase未接続です。</div>'; return; }
  const {data,error}=await sb.from("si_members").select("*").order("name");
  if(error){ box.innerHTML='<div class="empty">読み込み失敗：'+esc(error.message)+'</div>'; return; }
  members=data||[];
  box.innerHTML="";
  if(members.length===0){ box.innerHTML='<div class="empty">メンバーがいません。</div>'; }
  members.forEach(m=>{
    const r=document.createElement("div"); r.className="mrow";
    r.innerHTML='<span>'+esc(m.name)+'</span>';
    const del=document.createElement("button"); del.className="btn warn sm"; del.textContent="削除";
    del.onclick=()=>deleteMember(m.id);
    r.appendChild(del); box.appendChild(r);
  });
  renderParticipants();
}
async function addMember(){
  const inp=document.getElementById("newMember"); const name=inp.value.trim();
  if(!name){ return; }
  if(!sb){ showMsg("Supabase未接続です。","err"); return; }
  const {error}=await sb.from("si_members").insert([{name:name}]);
  if(error){ showMsg("追加失敗："+error.message,"err"); return; }
  inp.value=""; loadMembers();
}
async function deleteMember(id){
  if(!confirm("このメンバーを削除しますか？")) return;
  await sb.from("si_members").delete().eq("id",id);
  loadMembers();
}
function renderParticipants(){
  const box=document.getElementById("participantChips"); box.innerHTML="";
  if(members.length===0){ box.innerHTML='<span class="hint">メンバー未登録です。「メンバー」タブから登録してください。</span>'; return; }
  members.forEach(m=>{
    const c=document.createElement("div");
    c.className="chip"+(participants[m.name]?" sel":"");
    c.textContent=m.name;
    c.onclick=()=>{ participants[m.name]=!participants[m.name]; renderParticipants(); };
    box.appendChild(c);
  });
}

/* ===================== 前回結果 ===================== */
async function loadPrev(){
  prevMap={};
  if(!sb) return;
  const {data}=await sb.from("si_records").select("results").eq("site",siteObj.name)
    .order("inspection_date",{ascending:false}).order("id",{ascending:false}).limit(1);
  if(data && data[0] && Array.isArray(data[0].results)){
    data[0].results.forEach(r=>{ prevMap[r.item]={result:r.result,comment:r.comment,note:r.note}; });
  }
}

/* ===================== 描画 ===================== */
function renderTabs(){
  const el=document.getElementById("tabs"); el.innerHTML="";
  siteObj.cats.forEach((c,ci)=>{
    const done=c.items.filter((_,ii)=>state[itemKey(ci,ii)].result).length;
    const b=document.createElement("div");
    b.className="tab"+(ci===current?" active":"");
    b.innerHTML=esc(c.name)+'<span class="cnt">'+done+"/"+c.items.length+"</span>";
    b.onclick=()=>{ current=ci; renderTabs(); renderItems(); };
    el.appendChild(b);
  });
}
function judgeClass(v){ const j=JUDGES.find(x=>x.v===v); return j?j.c:""; }
function paintItem(ci,ii){
  const key=itemKey(ci,ii), node=itemNodes[key]; if(!node) return;
  const st=state[key];
  node.querySelectorAll(".choices button").forEach(b=>{ b.className=(b.dataset.v===st.result)?judgeClass(st.result):""; });
  const show=(st.result==="要注意"||st.result==="不良");
  node.querySelector(".detail").className="detail"+(show?" show":"");
  const nt=node.querySelector(".note-in"); if(document.activeElement!==nt && nt.value!==st.note) nt.value=st.note;
  const ta=node.querySelector(".cmt");
  if(document.activeElement!==ta && ta.value!==st.comment) ta.value=st.comment;
  const asg=node.querySelector(".asg"); if(document.activeElement!==asg && asg.value!==st.assignee) asg.value=st.assignee;
  const due=node.querySelector(".due"); if(document.activeElement!==due && due.value!==st.due) due.value=st.due;
  node.querySelector(".by").textContent=st.by?("最終更新："+st.by):"";
  updateSummary();
}
function memberOptions(sel){
  let o='<option value="">担当者（任意）</option>';
  members.forEach(m=>{ o+='<option'+(m.name===sel?' selected':'')+'>'+esc(m.name)+'</option>'; });
  if(sel && !members.some(m=>m.name===sel)) o+='<option selected>'+esc(sel)+'</option>';
  return o;
}
function renderItems(){
  const cat=siteObj.cats[current];
  document.getElementById("catTitle").textContent=cat.name;
  const box=document.getElementById("items"); box.innerHTML=""; itemNodes={};
  cat.items.forEach((it,ii)=>{
    const key=itemKey(current,ii), st=state[key];
    const el=document.createElement("div"); el.className="item";
    const prev=prevMap[it.t];
    const prevExtra=[prev&&prev.comment?prev.comment:"",prev&&prev.note?prev.note:""].filter(Boolean).join("／");
    const prevHtml=prev?('<div class="prev">前回：<b>'+esc(sym(prev.result)||"—")+'</b>'+(prevExtra?'　'+esc(prevExtra):'')+'</div>'):'';
    el.innerHTML=
      '<div class="q"><span class="no">'+(ii+1)+'.</span>'+esc(it.t)+'</div>'+
      (it.d?'<div class="d">'+esc(it.d)+'</div>':'')+
      prevHtml+
      '<div class="choices">'+JUDGES.map(j=>'<button data-v="'+j.v+'">'+j.label+'</button>').join('')+'</div>'+
      '<label class="fld">特記事項（メモ）</label><input type="text" class="note-in" placeholder="確認内容・メモ（任意）">'+
      '<div class="detail">'+
        '<label class="fld">指導事項・改善コメント</label><textarea class="cmt" placeholder="指摘内容・指導事項"></textarea>'+
        '<div class="row2"><div><label class="fld">担当者</label><select class="asg">'+memberOptions(st.assignee)+'</select></div>'+
        '<div><label class="fld">改善期限（いつまでに）</label><input type="date" class="due"></div></div>'+
      '</div>'+
      '<div class="by"></div>';
    el.querySelectorAll(".choices button").forEach(b=>{
      b.onclick=()=>{ st.result=b.dataset.v; st.by=myName(); paintItem(current,ii); renderTabs(); push(current,ii); };
    });
    let t1=null,t0=null;
    const nt=el.querySelector(".note-in"); nt.oninput=()=>{ st.note=nt.value; st.by=myName(); clearTimeout(t0); t0=setTimeout(()=>push(current,ii),500); };
    const ta=el.querySelector(".cmt"); ta.oninput=()=>{ st.comment=ta.value; st.by=myName(); clearTimeout(t1); t1=setTimeout(()=>push(current,ii),500); };
    const asg=el.querySelector(".asg"); asg.onchange=()=>{ st.assignee=asg.value; st.by=myName(); push(current,ii); };
    const due=el.querySelector(".due"); due.onchange=()=>{ st.due=due.value; st.by=myName(); push(current,ii); };
    itemNodes[key]=el; box.appendChild(el); paintItem(current,ii);
  });
}
function updateSummary(){
  let ok=0,w=0,ng=0;
  Object.values(state).forEach(s=>{ if(s.result==="良")ok++; else if(s.result==="要注意")w++; else if(s.result==="不良")ng++; });
  findings.forEach(f=>{ if(f.result==="良")ok++; else if(f.result==="要注意")w++; else if(f.result==="不良")ng++; });
  document.getElementById("cOk").textContent=ok;
  document.getElementById("cWarn").textContent=w;
  document.getElementById("cNg").textContent=ng;
}
function flash(key){ const n=itemNodes[key]; if(!n)return; n.classList.add("flash"); setTimeout(()=>n.classList.remove("flash"),700); }

/* ===================== 追加発見箇所 ===================== */
function renderFindings(){
  const box=document.getElementById("findings"); box.innerHTML="";
  findings.forEach((f,idx)=>{
    const el=document.createElement("div"); el.className="findrow";
    el.innerHTML=
      '<label class="fld">場所・内容</label><input type="text" class="floc" placeholder="例：破砕機まわり チェーンカバー無し">'+
      '<div class="choices" style="margin-top:8px;">'+JUDGES.map(j=>'<button data-v="'+j.v+'">'+j.label+'</button>').join('')+'</div>'+
      '<label class="fld">指導事項・改善コメント</label><textarea class="fcmt"></textarea>'+
      '<div class="row2"><div><label class="fld">担当者</label><select class="fasg">'+memberOptions(f.assignee)+'</select></div>'+
      '<div><label class="fld">改善期限</label><input type="date" class="fdue"></div></div>'+
      '<button class="btn warn sm" style="margin-top:8px;">この行を削除</button>';
    const loc=el.querySelector(".floc"); loc.value=f.location||"";
    loc.oninput=()=>{ f.location=loc.value; f.by=myName(); pushFinding(f); };
    el.querySelectorAll(".choices button").forEach(b=>{ b.className=(b.dataset.v===f.result)?judgeClass(f.result):"";
      b.onclick=()=>{ f.result=b.dataset.v; f.by=myName(); renderFindings(); updateSummary(); pushFinding(f); }; });
    const c=el.querySelector(".fcmt"); c.value=f.comment||""; c.oninput=()=>{ f.comment=c.value; f.by=myName(); pushFinding(f); };
    const a=el.querySelector(".fasg"); a.value=f.assignee||""; a.onchange=()=>{ f.assignee=a.value; f.by=myName(); pushFinding(f); };
    const d=el.querySelector(".fdue"); d.value=f.due||""; d.onchange=()=>{ f.due=d.value; f.by=myName(); pushFinding(f); };
    el.querySelector(".btn.warn").onclick=()=>{ delFinding(f.id); };
    box.appendChild(el);
  });
  updateSummary();
}
function addFinding(){
  const f={id:"x"+Date.now()+Math.floor(Math.random()*999),location:"",result:"",comment:"",assignee:"",due:"",by:myName()};
  findings.push(f); renderFindings(); pushFinding(f);
}
async function delFinding(id){
  findings=findings.filter(f=>f.id!==id); renderFindings();
  if(sb && session) await sb.from("si_live").delete().eq("session_id",session).eq("item_key","extra:"+id);
}

/* ===================== Realtime ===================== */
async function joinSession(){
  if(!siteObj){ showMsg("先に拠点を選んでください。","err"); return; }
  if(!sb){ showMsg("Supabase未接続です。","err"); return; }
  if(!document.getElementById("inspector").value.trim()){ showMsg("あなたの名前を入力してください。","err"); return; }
  const date=document.getElementById("date").value||todayStr();
  session=site+"|"+date;
  buildState(); findings=[];
  await loadPrev();

  const {data,error}=await sb.from("si_live").select("*").eq("session_id",session);
  if(error){ showMsg("読み込み失敗："+esc(error.message),"err"); return; }
  (data||[]).forEach(r=>applyRow(r));

  document.getElementById("checklistArea").style.display="block";
  current=0; renderTabs(); renderItems(); renderFindings();

  if(channel){ await sb.removeChannel(channel); channel=null; }
  channel=sb.channel("si-"+session,{config:{presence:{key:myName()+"-"+Math.random().toString(36).slice(2,7)}}});
  channel.on("broadcast",{event:"change"},(p)=>{
    const r=p.payload; if(!r || r.session_id!==session) return;
    applyRow(r,true);
  });
  channel.on("postgres_changes",{event:"*",schema:"public",table:"si_live"},(p)=>{
    if(p.eventType==="DELETE"){ return; }
    if(!p.new || p.new.session_id!==session){ return; }
    applyRow(p.new,true);
  });
  channel.on("presence",{event:"sync"},()=>{ const n=Object.keys(channel.presenceState()).length; setLive(true,"同時編集中："+n+"人（"+siteObj.name+" "+date+"）"); });
  channel.subscribe(async(s)=>{
    if(s==="SUBSCRIBED"){ setLive(true,"接続しました（"+siteObj.name+" "+date+"）"); await channel.track({name:myName()}); }
    else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"){ setLive(false,"接続エラー（Realtime未有効の可能性）"); }
  });
  showMsg(siteObj.name+" "+date+" の点検を開始しました。","info");
  try{ localStorage.setItem("si_last",JSON.stringify({site:site,date:date,inspector:myName(),participants:Object.keys(participants).filter(n=>participants[n])})); }catch(e){}
}
function applyRow(r,live){
  if(!r||!r.item_key) return;
  if(r.item_key.indexOf("extra:")===0){
    const id=r.item_key.slice(6);
    let f=findings.find(x=>x.id===id);
    if(!f){ f={id:id}; findings.push(f); }
    f.location=r.item||""; f.result=r.result||""; f.comment=r.comment||""; f.assignee=r.assignee||""; f.due=normDate(r.due_date); f.by=r.updated_by||"";
    if(live) renderFindings();
    return;
  }
  if(!(r.item_key in state)) return;
  state[r.item_key]={result:r.result||"",note:r.note||"",comment:r.comment||"",assignee:r.assignee||"",due:normDate(r.due_date),by:r.updated_by||""};
  if(live){
    const parts=r.item_key.split("_"), ci=parseInt(parts[0],10), ii=parseInt(parts[1],10);
    if(ci===current){ paintItem(ci,ii); flash(r.item_key); }
    renderTabs();
  }
}
function broadcast(row){
  if(channel){ try{ channel.send({type:"broadcast",event:"change",payload:row}); }catch(e){ console.error("bc",e); } }
}
async function push(ci,ii){
  if(!session) return;
  const key=itemKey(ci,ii), st=state[key], it=siteObj.cats[ci].items[ii];
  const row={session_id:session,item_key:key,category:siteObj.cats[ci].name,item:it.t,
    result:st.result,note:st.note,comment:st.comment,assignee:st.assignee,due_date:st.due||null,updated_by:st.by};
  broadcast(row);                          // 相手画面へ即送信（追加設定不要）
  if(!sb) return;
  const {error}=await sb.from("si_live").upsert([row],{onConflict:"session_id,item_key"});  // 永続化（再読込・後から参加した人用）
  if(error) console.error("push",error);
}
async function pushFinding(f){
  if(!session) return;
  const row={session_id:session,item_key:"extra:"+f.id,category:"追加確認",item:f.location,
    result:f.result,note:"",comment:f.comment,assignee:f.assignee,due_date:f.due||null,updated_by:f.by};
  broadcast(row);
  if(!sb) return;
  const {error}=await sb.from("si_live").upsert([row],{onConflict:"session_id,item_key"});
  if(error) console.error("pushFinding",error);
}

/* ===================== 保存 ===================== */
function showMsg(t,type){ const m=document.getElementById("msg"); m.textContent=t; m.className="msg "+type; if(type!=="err") setTimeout(()=>{m.className="msg";},4000); window.scrollTo({top:0,behavior:"smooth"}); }
async function save(){
  if(!sb||!session){ showMsg("先に点検を開始してください。","err"); return; }
  const inspector=document.getElementById("inspector").value.trim();
  if(!inspector){ showMsg("あなたの名前を入力してください。","err"); return; }
  const date=document.getElementById("date").value||todayStr();
  const weather=document.getElementById("weather").value;
  const parts=Object.keys(participants).filter(n=>participants[n]);

  const results=[]; let unanswered=0,ok=0,w=0,ng=0;
  siteObj.cats.forEach((c,ci)=>c.items.forEach((it,ii)=>{
    const st=state[itemKey(ci,ii)];
    if(!st.result) unanswered++;
    if(st.result==="良")ok++; else if(st.result==="要注意")w++; else if(st.result==="不良")ng++;
    results.push({category:c.name,item:it.t,result:st.result||"未回答",note:st.note||"",comment:st.comment||"",assignee:st.assignee||"",due:st.due||""});
  }));
  const fin=findings.filter(f=>f.location||f.result).map(f=>{
    if(f.result==="良")ok++; else if(f.result==="要注意")w++; else if(f.result==="不良")ng++;
    return {location:f.location||"",result:f.result||"",comment:f.comment||"",assignee:f.assignee||"",due:f.due||""};
  });
  if(unanswered>0 && !confirm("未回答が "+unanswered+" 項目あります。確定保存しますか？")) return;

  const rec={site:siteObj.name,inspection_date:date,weather:weather,participants:parts,
    results:results,findings:fin,ok_count:ok,warn_count:w,ng_count:ng};
  const btn=document.getElementById("saveBtn"); btn.disabled=true; btn.textContent="保存中…";
  const {error}=await sb.from("si_records").insert([rec]);
  if(error){ btn.disabled=false; btn.textContent="点検を確定して保存する"; showMsg("保存失敗："+error.message,"err"); return; }
  await sb.from("si_live").delete().eq("session_id",session);
  buildState(); findings=[]; await loadPrev(); renderTabs(); renderItems(); renderFindings();
  btn.disabled=false; btn.textContent="点検を確定して保存する";
  showMsg("保存しました。（○"+ok+" / △"+w+" / ×"+ng+"）","ok");
}
async function clearSession(){
  if(!sb||!session){ return; }
  if(!confirm("この点検の入力をすべて消去しますか？")) return;
  await sb.from("si_live").delete().eq("session_id",session);
  buildState(); findings=[]; renderTabs(); renderItems(); renderFindings();
  showMsg("入力を消去しました。","info");
}

/* ===================== 履歴 ===================== */
async function loadHistory(){
  const box=document.getElementById("histList");
  if(!sb){ box.innerHTML='<div class="empty">Supabase未接続です。</div>'; return; }
  box.innerHTML='<div class="empty">読み込み中…</div>';
  const {data,error}=await sb.from("si_records").select("*").order("inspection_date",{ascending:false}).order("id",{ascending:false}).limit(60);
  if(error){ box.innerHTML='<div class="empty">読み込み失敗：'+esc(error.message)+'</div>'; return; }
  if(!data||!data.length){ box.innerHTML='<div class="empty">記録がありません。</div>'; return; }
  box.innerHTML="";
  data.forEach(r=>{
    const d=document.createElement("div"); d.className="hist";
    const badges='<span class="badge ok">○ '+(r.ok_count||0)+'</span><span class="badge warn">△ '+(r.warn_count||0)+'</span><span class="badge ng">× '+(r.ng_count||0)+'</span>';
    let det="拠点："+esc(r.site||"-")+" ／ 天候："+esc(r.weather||"-");
    if(r.participants&&r.participants.length) det+="<br>参加："+esc(r.participants.join("・"));
    const ngItems=(r.results||[]).filter(x=>x.result==="不良"||x.result==="要注意");
    if(ngItems.length){ det+="<br>指摘："+ngItems.slice(0,6).map(x=>sym(x.result)+esc(x.item)+(x.comment?"（"+esc(x.comment)+"）":"")).join(" / "); if(ngItems.length>6) det+=" ほか"; }
    if(r.findings&&r.findings.length){ det+="<br>追加："+r.findings.map(f=>esc(f.location)).filter(Boolean).join(" / "); }
    d.innerHTML='<div class="top"><span>'+normDate(r.inspection_date)+'</span><span>'+badges+'</span></div><div class="prev" style="margin-top:6px;">'+det+'</div>';
    box.appendChild(d);
  });
}

/* ===================== ビュー切替 ===================== */
function showView(v){
  ["input","member","hist"].forEach(x=>{ document.getElementById("view-"+x).style.display=(x===v)?"block":"none"; });
  document.getElementById("navInput").className=v==="input"?"active":"";
  document.getElementById("navMember").className=v==="member"?"active":"";
  document.getElementById("navHist").className=v==="hist"?"active":"";
  if(v==="member") loadMembers();
  if(v==="hist") loadHistory();
}

/* ===================== 初期化 ===================== */
(async function init(){
  document.getElementById("date").value=todayStr();
  renderSites();
  if(!sb){ setLive(false,"Supabase未接続（キー未設定）"); return; }
  await loadMembers();
  // 直前の点検を自動で復帰（リロードで最初に戻らないように）
  try{
    const last=JSON.parse(localStorage.getItem("si_last")||"null");
    if(last && last.site && SITES.some(s=>s.key===last.site)){
      document.getElementById("inspector").value=last.inspector||"";
      if(last.date) document.getElementById("date").value=last.date;
      participants={}; (last.participants||[]).forEach(n=>{ participants[n]=true; });
      selectSite(last.site);
      renderParticipants();
      await joinSession();
    }
  }catch(e){ console.error(e); }
})();
</script>
