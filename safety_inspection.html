<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>安全点検アプリ（共同編集）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#0b5cad; --blue-dark:#083f77; --bg:#eef2f6; --card:#fff;
    --ok:#1e9e57; --ng:#d63b3b; --na:#8a94a6; --line:#d7dde5; --text:#1f2733;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;}
  header{background:var(--blue);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;
    box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header h1{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .live{font-size:12px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:6px;opacity:.95;}
  .dot{width:9px;height:9px;border-radius:50%;background:#9fb3c8;display:inline-block;}
  .dot.on{background:#37e07a;box-shadow:0 0 0 3px rgba(55,224,122,.3);}
  .wrap{max-width:820px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--blue-dark);
    border-left:5px solid var(--blue);padding-left:10px;}
  label.fld{display:block;font-size:13px;font-weight:700;color:#55606e;margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;background:#fbfcfe;color:var(--text);}
  textarea{min-height:60px;resize:vertical;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
  .tab{flex:1;min-width:110px;padding:12px 8px;border-radius:12px;text-align:center;
    background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;color:#55606e;}
  .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .tab .cnt{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px;}
  .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;transition:background .3s;}
  .item.flash{background:#fff7d6;}
  .item .q{font-weight:600;margin-bottom:10px;}
  .item .q .no{color:var(--blue);font-weight:700;margin-right:6px;}
  .choices{display:flex;gap:8px;}
  .choices button{flex:1;padding:12px 4px;border-radius:10px;border:2px solid var(--line);
    background:#fff;font-size:15px;font-weight:700;color:#7a8493;cursor:pointer;}
  .choices button.sel-ok{background:var(--ok);color:#fff;border-color:var(--ok);}
  .choices button.sel-ng{background:var(--ng);color:#fff;border-color:var(--ng);}
  .choices button.sel-na{background:var(--na);color:#fff;border-color:var(--na);}
  .note{margin-top:8px;display:none;}
  .note.show{display:block;}
  .by{font-size:11px;color:#9aa4b2;margin-top:6px;min-height:14px;}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:12px;font-size:17px;
    font-weight:700;color:#fff;background:var(--blue);cursor:pointer;margin-top:4px;}
  .btn:active{background:var(--blue-dark);}
  .btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);}
  .btn.warn{background:#fff;color:var(--ng);border:2px solid var(--ng);margin-top:10px;}
  .btn:disabled{opacity:.5;}
  .msg{padding:12px;border-radius:10px;margin-bottom:12px;font-weight:700;display:none;}
  .msg.ok{background:#e4f6ec;color:var(--ok);display:block;}
  .msg.err{background:#fbe6e6;color:var(--ng);display:block;}
  .msg.info{background:#e6f0fb;color:var(--blue-dark);display:block;}
  .hist{border-bottom:1px solid var(--line);padding:12px 0;}
  .hist:last-child{border-bottom:none;}
  .hist .top{display:flex;justify-content:space-between;font-weight:700;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;margin-right:4px;}
  .badge.ng{background:#fbe6e6;color:var(--ng);}
  .badge.ok{background:#e4f6ec;color:var(--ok);}
  .hist .det{font-size:13px;color:#66707e;margin-top:4px;}
  .switch{display:flex;gap:8px;margin-bottom:16px;}
  .switch button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--blue);
    background:#fff;color:var(--blue);font-weight:700;font-size:15px;cursor:pointer;}
  .switch button.active{background:var(--blue);color:#fff;}
  .hint{font-size:12px;color:#8a94a6;margin-top:6px;}
  .empty{text-align:center;color:#8a94a6;padding:30px 0;}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0;">
    <h1>🦺 安全点検アプリ（共同編集）</h1>
    <div class="live"><span class="dot" id="liveDot"></span><span id="liveText">接続中…</span></div>
  </div>
</header>
<div class="wrap">

  <div class="switch">
    <button id="navInput" class="active" onclick="showView('input')">点検を入力</button>
    <button id="navHist" onclick="showView('hist')">点検履歴</button>
  </div>

  <!-- ===== 入力ビュー ===== -->
  <div id="view-input">
    <div id="msg" class="msg"></div>

    <div class="card">
      <h2>点検情報</h2>
      <label class="fld">点検セッション（同じ名前の人が一緒に編集します）</label>
      <input type="text" id="session" placeholder="例：2026-07-29 A工場">
      <div class="row2">
        <div>
          <label class="fld">点検日</label>
          <input type="date" id="date">
        </div>
        <div>
          <label class="fld">天候</label>
          <select id="weather">
            <option>晴れ</option><option>くもり</option><option>雨</option><option>雪</option>
          </select>
        </div>
      </div>
      <label class="fld">あなたの名前</label>
      <input type="text" id="inspector" placeholder="氏名を入力（誰が入力したか記録されます）">
      <button class="btn ghost" style="margin-top:12px;" onclick="joinSession()">このセッションに参加／切替</button>
      <p class="hint">同じ「点検セッション」名を全員が入力すると、1枚の点検表を一緒に編集できます。良／否をタップすると全員の画面にすぐ反映されます。</p>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="card">
      <h2 id="catTitle"></h2>
      <div id="items"></div>
    </div>

    <button class="btn" id="saveBtn" onclick="save()">点検を確定して保存する</button>
    <button class="btn warn" onclick="clearSession()">このセッションの入力を全消去</button>
    <p class="hint">「確定して保存」で、この点検表を1件として履歴に保存します。保存後、共同編集中の内容は消去され、次の点検を新しく始められます。</p>
  </div>

  <!-- ===== 履歴ビュー ===== -->
  <div id="view-hist" style="display:none;">
    <div class="card">
      <h2>過去の点検記録</h2>
      <div id="histList"><div class="empty">読み込み中…</div></div>
      <button class="btn ghost" onclick="loadHistory()">再読み込み</button>
    </div>
  </div>

</div>

<script>
/* ===================== 設定 ===================== */
/* Supabaseの接続情報。URLは予約システムと同じプロジェクト。
   ANON_KEYには「anon public」キーを貼り付けてください（手順書参照）。 */
const SUPABASE_URL = "https://uzjftccxoipspazrtuvl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_EtJx9KqlB3v7rtD5uIBOtg_U1mvCbCG";

let sb = null;
try {
  if (SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith("ここに")) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch(e){ console.error(e); }

/* ===================== 点検項目 ===================== */
const CATEGORIES = [
  { key:"equip", name:"設備・機械", items:[
    "破砕機・重機に異音や異常な振動がない",
    "各部に油漏れ・燃料漏れがない",
    "ベルトコンベアに損傷・ズレ・巻き込みの危険がない",
    "非常停止ボタンが正常に作動する",
    "安全カバー・防護ガードが正しく取り付けられている",
    "電源・配線に損傷や露出がない",
    "集塵・防じん装置が正常に作動している",
    "給油・点検記録が最新化されている"
  ]},
  { key:"env", name:"作業環境・現場巡視", items:[
    "通路・作業床が整理整頓され、つまずき・転倒の危険がない",
    "廃棄物が区分どおり適正に保管されている",
    "床面の油・水による滑りの危険がない",
    "作業区域の照明が十分に点灯している",
    "換気・粉じん対策が機能している",
    "危険箇所・立入禁止の表示が掲示されている",
    "保護具（ヘルメット・手袋・保護メガネ等）を全員が着用している",
    "重機と歩行者の動線が分離・明示されている"
  ]},
  { key:"fire", name:"消防・防災設備", items:[
    "消火器が所定位置にあり、圧力・使用期限が正常である",
    "消火栓・ホース・ポンプに異常がない",
    "避難経路が確保され、障害物が置かれていない",
    "誘導灯・非常灯が点灯している",
    "火災報知設備が正常に作動する",
    "危険物・可燃物が適正に保管されている",
    "緊急連絡先・避難経路図が掲示されている"
  ]}
];

let current = "equip";
let session = "";          // 現在のセッション名
let channel = null;        // Realtimeチャンネル
let itemNodes = {};        // 現在表示中の項目DOM（item_key -> element）

// 回答保持: state[itemKey] = {result, note, by}
const state = {};
function itemKey(catKey, i){ return catKey + "_" + i; }
function initState(){
  CATEGORIES.forEach(c=>{ c.items.forEach((_,i)=>{ state[itemKey(c.key,i)] = {result:"", note:"", by:""}; }); });
}
initState();

/* ===================== 日付ユーティリティ（ずれ対策） ===================== */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function normDate(v){ return String(v).split("T")[0]; }

/* ===================== 在席表示 ===================== */
function setLive(on, text){
  document.getElementById("liveDot").className = "dot" + (on?" on":"");
  document.getElementById("liveText").textContent = text;
}

/* ===================== 画面描画 ===================== */
function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const done = c.items.filter((_,i)=>state[itemKey(c.key,i)].result).length;
    const b = document.createElement("div");
    b.className = "tab" + (c.key===current ? " active":"");
    b.innerHTML = c.name + '<span class="cnt">'+done+' / '+c.items.length+'</span>';
    b.onclick = ()=>{ current=c.key; renderTabs(); renderItems(); };
    el.appendChild(b);
  });
}
function paintItem(cat, i){
  const key = itemKey(cat.key, i);
  const node = itemNodes[key];
  if(!node) return;
  const st = state[key];
  const btns = node.querySelectorAll(".choices button");
  btns.forEach(b=>{
    b.className = "";
    if(b.dataset.v===st.result){
      b.className = st.result==="良"?"sel-ok":st.result==="否"?"sel-ng":"sel-na";
    }
  });
  const note = node.querySelector(".note");
  const ta = node.querySelector("textarea");
  note.className = "note" + (st.result==="否" ? " show":"");
  // 自分が入力中のテキストは上書きしない
  if(document.activeElement !== ta && ta.value !== st.note){ ta.value = st.note; }
  node.querySelector(".by").textContent = st.by ? ("最終更新："+st.by) : "";
}
function renderItems(){
  const cat = CATEGORIES.find(c=>c.key===current);
  document.getElementById("catTitle").textContent = cat.name;
  const box = document.getElementById("items");
  box.innerHTML = "";
  itemNodes = {};
  cat.items.forEach((q, i)=>{
    const key = itemKey(cat.key, i);
    const item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      '<div class="q"><span class="no">'+(i+1)+'.</span>'+q+'</div>'+
      '<div class="choices">'+
        '<button data-v="良">良</button>'+
        '<button data-v="否">否</button>'+
        '<button data-v="該当なし">該当なし</button>'+
      '</div>'+
      '<div class="note"><textarea placeholder="指摘内容・対応事項を入力"></textarea></div>'+
      '<div class="by"></div>';
    const btns = item.querySelectorAll(".choices button");
    const ta = item.querySelector("textarea");
    btns.forEach(b=>{
      b.onclick = ()=>{
        const st = state[key];
        st.result = b.dataset.v;
        st.by = myName();
        paintItem(cat, i); renderTabs();
        pushChange(cat, i, q);
      };
    });
    let noteTimer = null;
    ta.oninput = ()=>{
      const st = state[key];
      st.note = ta.value; st.by = myName();
      clearTimeout(noteTimer);
      noteTimer = setTimeout(()=>{ pushChange(cat, i, q); renderTabs(); }, 500);
    };
    itemNodes[key] = item;
    box.appendChild(item);
    paintItem(cat, i);
  });
}
function flash(key){
  const node = itemNodes[key];
  if(!node) return;
  node.classList.add("flash");
  setTimeout(()=>node.classList.remove("flash"), 700);
}

/* ===================== Realtime 同期 ===================== */
function myName(){ return (document.getElementById("inspector").value.trim() || "匿名"); }

async function joinSession(){
  if(!sb){ showMsg("Supabase未接続です。anon publicキーを設定してください（手順書参照）。", "err"); return; }
  const s = document.getElementById("session").value.trim();
  if(!s){ showMsg("点検セッション名を入力してください。", "err"); return; }
  session = s;

  // 既存チャンネルを解除
  if(channel){ await sb.removeChannel(channel); channel = null; }

  // 状態を初期化して、このセッションの既存データを読み込み
  initState();
  const { data, error } = await sb.from("safety_inspection_live").select("*").eq("session_id", session);
  if(error){ showMsg("読み込み失敗："+error.message, "err"); return; }
  (data||[]).forEach(r=>{
    if(state[r.item_key]) state[r.item_key] = {result:r.result||"", note:r.note||"", by:r.updated_by||""};
  });
  renderTabs(); renderItems();

  // Realtime購読（変更通知＋在席）
  channel = sb.channel("live-"+session, { config:{ presence:{ key: myName()+"-"+Math.random().toString(36).slice(2,7) } } });
  channel.on("postgres_changes",
    { event:"*", schema:"public", table:"safety_inspection_live", filter:"session_id=eq."+session },
    (payload)=>{
      const r = payload.new;
      if(!r || !r.item_key || !(r.item_key in state)) return;
      state[r.item_key] = {result:r.result||"", note:r.note||"", by:r.updated_by||""};
      const parts = r.item_key.split("_");
      const catKey = parts[0]; const idx = parseInt(parts[1],10);
      if(catKey===current){ const cat=CATEGORIES.find(c=>c.key===catKey); paintItem(cat, idx); flash(r.item_key); }
      renderTabs();
    });
  channel.on("presence", { event:"sync" }, ()=>{
    const st = channel.presenceState();
    const n = Object.keys(st).length;
    setLive(true, "同時編集中："+n+"人（セッション："+session+"）");
  });
  channel.subscribe(async (status)=>{
    if(status==="SUBSCRIBED"){
      setLive(true, "接続しました（セッション："+session+"）");
      await channel.track({ name: myName(), at: Date.now() });
    } else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT"){
      setLive(false, "接続エラー（Realtime未有効の可能性）");
    }
  });
  showMsg("セッション「"+session+"」に参加しました。", "info");
}

async function pushChange(cat, i, q){
  if(!sb || !session) return;
  const key = itemKey(cat.key, i);
  const st = state[key];
  const row = {
    session_id: session, item_key: key, category: cat.name, item: q,
    result: st.result, note: st.note, updated_by: st.by
  };
  const { error } = await sb.from("safety_inspection_live").upsert([row], { onConflict:"session_id,item_key" });
  if(error) console.error("upsert error", error);
}

/* ===================== 確定保存 ===================== */
function showMsg(text, type){
  const m = document.getElementById("msg");
  m.textContent = text; m.className = "msg " + type;
  if(type==="ok"||type==="info"){ setTimeout(()=>{ m.className="msg"; }, 4000); }
  window.scrollTo({top:0, behavior:"smooth"});
}
async function save(){
  if(!sb){ showMsg("Supabase未接続です。", "err"); return; }
  if(!session){ showMsg("先にセッションに参加してください。", "err"); return; }
  const inspector = document.getElementById("inspector").value.trim();
  const date = document.getElementById("date").value || todayStr();
  const weather = document.getElementById("weather").value;
  if(!inspector){ showMsg("あなたの名前を入力してください。", "err"); return; }

  let unanswered = 0;
  const results = [];
  CATEGORIES.forEach(c=>{
    c.items.forEach((q,i)=>{
      const st = state[itemKey(c.key,i)];
      if(!st.result) unanswered++;
      results.push({ category:c.name, item:q, result:st.result||"未回答", note:st.note||"" });
    });
  });
  if(unanswered>0 && !confirm("未回答が "+unanswered+" 項目あります。確定保存しますか？")) return;

  const ngList = results.filter(r=>r.result==="否");
  const okCount = results.filter(r=>r.result==="良").length;
  const record = {
    inspection_date: date, inspector: inspector, weather: weather,
    ok_count: okCount, ng_count: ngList.length, results: results,
    overall_note: ngList.length>0 ? ngList.map(r=>"["+r.category+"] "+r.item+"："+r.note).join(" / ") : ""
  };

  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "保存中…";
  const { error } = await sb.from("safety_inspections").insert([record]);
  if(error){ btn.disabled=false; btn.textContent="点検を確定して保存する"; showMsg("保存失敗："+error.message, "err"); return; }

  // 共同編集の一時データを消去して次の点検へ
  await sb.from("safety_inspection_live").delete().eq("session_id", session);
  initState(); renderTabs(); renderItems();
  btn.disabled=false; btn.textContent="点検を確定して保存する";
  showMsg("点検を保存しました。（不適合 "+ngList.length+" 件）", "ok");
}

async function clearSession(){
  if(!sb || !session){ showMsg("先にセッションに参加してください。", "err"); return; }
  if(!confirm("このセッションの入力内容をすべて消去します。よろしいですか？")) return;
  await sb.from("safety_inspection_live").delete().eq("session_id", session);
  initState(); renderTabs(); renderItems();
  showMsg("入力を消去しました。", "info");
}

/* ===================== 履歴 ===================== */
async function loadHistory(){
  const box = document.getElementById("histList");
  if(!sb){ box.innerHTML = '<div class="empty">Supabase未接続です。</div>'; return; }
  box.innerHTML = '<div class="empty">読み込み中…</div>';
  const { data, error } = await sb.from("safety_inspections")
    .select("*").order("inspection_date",{ascending:false}).order("id",{ascending:false}).limit(50);
  if(error){ box.innerHTML = '<div class="empty">読み込み失敗：'+error.message+'</div>'; return; }
  if(!data || data.length===0){ box.innerHTML = '<div class="empty">記録がありません。</div>'; return; }
  box.innerHTML = "";
  data.forEach(r=>{
    const d = document.createElement("div");
    d.className = "hist";
    const ng = r.ng_count||0;
    const badge = ng>0 ? '<span class="badge ng">不適合 '+ng+'</span>' : '<span class="badge ok">異常なし</span>';
    let det = "点検者："+(r.inspector||"-")+" ／ 天候："+(r.weather||"-");
    if(r.overall_note){ det += "<br>指摘："+r.overall_note; }
    d.innerHTML =
      '<div class="top"><span>'+normDate(r.inspection_date)+'</span><span>'+badge+'</span></div>'+
      '<div class="det">'+det+'</div>';
    box.appendChild(d);
  });
}

/* ===================== ビュー切替 ===================== */
function showView(v){
  document.getElementById("view-input").style.display = v==="input"?"block":"none";
  document.getElementById("view-hist").style.display  = v==="hist"?"block":"none";
  document.getElementById("navInput").className = v==="input"?"active":"";
  document.getElementById("navHist").className  = v==="hist"?"active":"";
  if(v==="hist") loadHistory();
}

/* ===================== 初期化 ===================== */
document.getElementById("date").value = todayStr();
document.getElementById("session").value = todayStr() + " 点検";
renderTabs();
renderItems();
if(!sb){ setLive(false, "Supabase未接続（キー未設定）"); }
else { setLive(false, "「参加／切替」を押すと同期開始します"); }
</script>
</body>
</html>
